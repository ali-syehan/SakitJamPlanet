<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Schedule Lookup</title>
<style>
:root{
  --teal:#46b9bd;
  --teal-dark:#0786a5;
  --teal-deep:#05708d;
  --yellow:#ffc400;
  --yellow-soft:#ffd84d;
  --navy:#18355f;
  --muted:#7d8b99;
  --card:#ffffff;
  --line:#e7edf0;
}
*{ box-sizing:border-box; }
body{
  font-family: Arial, sans-serif;
  margin:0;
  padding:24px 14px;
  min-height:100vh;
  background:#d3d3d3;
}
.phone-shell{
  max-width:430px;
  margin:0 auto;
  background:#f7f9fa;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 38px rgba(0,0,0,.28);
  border:1px solid rgba(0,0,0,.08);
}
.app-header{
  background:var(--teal-dark);
  color:#fff;
  padding:12px 16px 18px;
  position:relative;
}
.status-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  opacity:.95;
  margin-bottom:10px;
}
.header-title{
  text-align:center;
  font-size:16px;
  letter-spacing:.5px;
  text-transform:uppercase;
  font-weight:400;
}
.header-title strong{ font-weight:700; }
.menu-dot{
  position:absolute;
  left:14px;
  top:34px;
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.16);
  font-weight:700;
}
.hero-panel{
  background:var(--teal);
  padding:22px 18px 24px;
  color:#fff;
  text-align:center;
  border-bottom:6px solid var(--teal-deep);
}
.hero-icon{
  width:84px;
  height:84px;
  border-radius:50%;
  margin:0 auto 12px;
  background:#fff;
  color:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}
h2{
  margin:0;
  color:#fff;
  font-size:22px;
  line-height:1.25;
  letter-spacing:.4px;
  text-transform:uppercase;
}
.hero-subtitle{
  margin-top:7px;
  font-size:12px;
  opacity:.88;
}
.container{
  padding:18px;
  background:#ffffff;
}
.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--navy);
  margin-bottom:7px;
  text-transform:uppercase;
}
input{
  width:100%;
  padding:13px 12px;
  border:1px solid #d6e1e5;
  border-radius:8px;
  font-size:14px;
  color:var(--navy);
  background:#f7fbfc;
  outline:none;
}
input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(70,185,189,.16);
}
button{
  width:100%;
  border:0;
  border-radius:8px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.btn-search{
  background:var(--yellow);
  color:var(--navy);
  padding:14px;
  box-shadow:0 5px 0 #d7a900;
  margin:4px 0 12px;
}
.btn-search:hover{ transform:translateY(-1px); filter:brightness(.98); }
.btn-example{
  background:var(--teal-dark);
  color:#fff;
  padding:12px;
  box-shadow:0 4px 0 var(--teal-deep);
}
.result{
  margin-top:16px;
  background:#f7f9fa;
  border-radius:10px;
  border:1px solid var(--line);
  overflow:hidden;
  min-height:56px;
}
.result-title{
  background:var(--teal-dark);
  color:#fff;
  padding:12px 14px;
  font-size:13px;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.5px;
  font-weight:700;
  border-bottom:4px solid var(--yellow);
}
.card{
  background:#fff;
  margin:12px;
  border-radius:8px;
  border-left:5px solid var(--teal-dark);
  box-shadow:0 2px 10px rgba(0,0,0,.07);
  overflow:hidden;
}
.row{
  display:grid;
  grid-template-columns:112px 1px 1fr;
  align-items:center;
  min-height:38px;
  border-bottom:1px solid var(--line);
}
.row:last-child{ border-bottom:0; }
.label{
  padding:10px 12px;
  font-size:12px;
  color:var(--navy);
  font-weight:700;
  text-align:left;
}
.separator{
  width:1px;
  height:22px;
  background:#d6e1e5;
}
.value{
  padding:10px 12px;
  font-size:13px;
  color:#263647;
  font-weight:600;
  text-align:left;
}
.notfound{
  margin:12px;
  padding:14px;
  background:#fff4d0;
  color:#836000;
  border-left:5px solid var(--yellow);
  border-radius:8px;
  font-weight:700;
}
.bottom-bar{
  height:50px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--navy);
  font-size:14px;
  font-weight:700;
  letter-spacing:.7px;
  text-transform:uppercase;
  border-top:1px solid #e7b900;
}
@media(max-width:390px){
  body{ padding:12px 8px; }
  .container{ padding:14px; }
  .form-row{ grid-template-columns:1fr; }
  .row{ grid-template-columns:98px 1px 1fr; }
  .label,.value{ font-size:12px; padding:9px 10px; }
}
.splash-page{
  max-width:430px;
  min-height:720px;
  margin:0 auto;
  background:linear-gradient(180deg, var(--teal-dark), var(--teal));
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 38px rgba(0,0,0,.28);
  border:1px solid rgba(0,0,0,.08);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px 24px;
  position:relative;
}
.splash-page::before{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  top:-70px;
  right:-70px;
}
.splash-page::after{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  background:rgba(255,196,0,.22);
  bottom:-60px;
  left:-55px;
}
.splash-logo{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#fff;
  color:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:54px;
  box-shadow:0 14px 26px rgba(0,0,0,.18);
  margin-bottom:22px;
  position:relative;
  z-index:1;
}
.splash-title{
  font-size:28px;
  line-height:1.22;
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.8px;
  margin-bottom:10px;
  position:relative;
  z-index:1;
}
.splash-subtitle{
  font-size:13px;
  opacity:.9;
  line-height:1.5;
  margin-bottom:8px;
  max-width:300px;
  position:relative;
  z-index:1;
}
.splash-database{
  font-size:12px;
  font-weight:700;
  letter-spacing:.5px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  padding:8px 14px;
  margin-bottom:34px;
  position:relative;
  z-index:1;
}
.splash-button{
  width:100%;
  max-width:260px;
  padding:15px 18px;
  background:var(--yellow);
  color:var(--navy);
  box-shadow:0 6px 0 #d7a900;
  position:relative;
  z-index:1;
}
.splash-button:hover{ transform:translateY(-1px); }
.hidden{ display:none; }
</style>
</head>
<body>
<div id="splashPage" class="splash-page">
  <div class="splash-logo">👤</div>
  <div class="splash-title">Sakit & Akibatnya</div>
  <div class="splash-subtitle">Aplikasi Pencarian berdasarkan Jam Planet</div>
  <div class="splash-database">Juni 2026 - Desember 2028</div>
  <button class="splash-button" onclick="showApp()">Ali Syehan</button>
</div>
<div id="mainApp" class="phone-shell hidden">
  <div class="app-header">
    <div class="status-row"><span>●●●</span><span class="hidden">◒ 21:34</span></div>
    <div class="menu-dot hidden">☰</div>
    <div class="header-title">Sakit & <strong>Akibatnya</strong></div>
  </div>
  <div class="hero-panel">
    <div class="hero-icon">👤</div>
    <h2 class="hidden">Sakit & Akibatnya</h2>
    <div class="hero-subtitle">Cari hasil berdasarkan tanggal dan waktu</div>
  </div>
  <div class="container">
    <div class="form-row">
      <div class="field">
        <label>Tanggal</label>
        <input type="date" id="inputTanggal" />
      </div>
      <div class="field">
        <label>Waktu</label>
        <input type="time" id="inputWaktu" />
      </div>
    </div>
    <button class="btn-search" onclick="lookupDataManual()">Cari</button>
    <button class="btn-example hidden" onclick="contohData()">Contoh</button>
    <div id="manualResult" class="result"></div>
  </div>
  <div class="bottom-bar"><span>Ali Syehan</span></div>
</div>

<script src="js/allRowsData.js"></script>
<script>
function getLocalDateValue() {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setLocalDateInput() {
  document.getElementById('inputTanggal').value = getLocalDateValue();
}

function showApp() {
  setLocalDateInput();
  document.getElementById('splashPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded', setLocalDateInput);

function textValue(value) {
  return value && value.trim ? value.trim() || "-" : (value || "-");
}

function getTimeRangeMatch(row, tanggal, waktu) {
  if (row[1] !== tanggal) return false;

  let jamMulai = new Date(`${row[1]}T${row[6]}:00`);
  let jamSelesai = new Date(`${row[1]}T${row[7]}:00`);
  let inputTime = new Date(`${tanggal}T${waktu}:00`);

  if (jamSelesai < jamMulai) {
    jamSelesai.setDate(jamSelesai.getDate() + 1);
    if (inputTime < jamMulai) {
      inputTime.setDate(inputTime.getDate() + 1);
    }
  }

  return inputTime >= jamMulai && inputTime <= jamSelesai;
}

function lookupDataManual() {
    const tanggal = document.getElementById('inputTanggal').value;
    const waktu = document.getElementById('inputWaktu').value;
    const manualDiv = document.getElementById('manualResult');

    if(!tanggal || !waktu){
      manualDiv.innerHTML = "Silakan masukkan tanggal dan waktu.";
      return;
    }

    if (typeof allRowsData === "undefined") {
      manualDiv.innerHTML = "<div class='notfound'>File js/allRowsData.js belum terbaca. Pastikan file berada di folder js.</div>";
      return;
    }

    const row = allRowsData.find(r => getTimeRangeMatch(r, tanggal, waktu));

    if(row){
      manualDiv.innerHTML = `<div class="result-title">Hasil Jawaban</div>
        <div class="card">
          <div class="row"><span class="label">No</span><span class="separator"></span><span class="value">${row[0]}</span></div>
          <div class="row"><span class="label">Tanggal</span><span class="separator"></span><span class="value">${row[1]}</span></div>
          <div class="row"><span class="label">Hari</span><span class="separator"></span><span class="value">${row[2]}</span></div>
          <div class="row"><span class="label">Fase</span><span class="separator"></span><span class="value">${row[3]}</span></div>
          <div class="row"><span class="label">Jam Ke</span><span class="separator"></span><span class="value">${row[4]}</span></div>
          <div class="row"><span class="label">Planet</span><span class="separator"></span><span class="value">${row[5]}</span></div>
          <div class="row"><span class="label">Jam Mulai</span><span class="separator"></span><span class="value">${row[6]}</span></div>
          <div class="row"><span class="label">Jam Selesai</span><span class="separator"></span><span class="value">${row[7]}</span></div>
          <div class="row"><span class="label">Laki-laki</span><span class="separator"></span><span class="value">${textValue(row[9])}</span></div>
          <div class="row"><span class="label">Wanita</span><span class="separator"></span><span class="value">${textValue(row[8])}</span></div>
        </div>`;
    }else{
      manualDiv.innerHTML = "<div class='notfound'>Data tidak ditemukan pada range waktu tersebut.</div>";
    }
}

function contohData() {
    document.getElementById('inputTanggal').value = '2026-06-04';
    document.getElementById('inputWaktu').value = '08:08';
    lookupDataManual();
}
</script>
</body>
</html>
